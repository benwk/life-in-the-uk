# XcodeGen spec. Generate the project with:  cd ios && xcodegen
# (brew install xcodegen). The .xcodeproj is generated, not committed.
name: Robin
options:
  bundleIdPrefix: uk.robin
  deploymentTarget:
    iOS: "17.0"
packages:
  RobinCore:
    path: RobinCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The content script reads ../content, outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Robin:
    type: application
    platform: iOS
    sources:
      - path: Robin
    dependencies:
      - package: RobinCore
    info:
      path: Robin/Info.plist
      properties:
        CFBundleDisplayName: Robin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.robin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Bundle content
        # content/ -> content.json inside the app (see tools/build_content.py)
        script: |
          python3 "${SRCROOT}/../tools/build_content.py" --out "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/content.json"
        basedOnDependencyAnalysis: false
